<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>后台 · 订单列表</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@media (min-width: 800px){.jf-side{position:sticky;top:0;align-self:flex-start}}
a{text-decoration:none;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #7A7A7A;outline-offset:1px}
.jf-row:hover{background:rgba(128,128,128,0.06)}
</style>
</helmet>
<div style="font-family: 'Geist', 'Noto Sans SC', sans-serif; font-size: 13px; background: {{t.bg}}; color: {{t.fg}}; min-height: 100%; display: flex; flex-wrap: wrap; align-items: stretch">
  <aside class="jf-side" style="flex: 0 0 240px; max-width: 100%; border-right: 1px solid {{t.border}}">
    <dc-import name="Sidebar" mode="{{mode}}" active="订单" hint-size="240px,900px"></dc-import>
  </aside>
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <div style="flex: 1 1 auto; width: 100%; max-width: 1120px; box-sizing: border-box; margin: 0 auto; padding: 40px 32px 32px; display: flex; flex-direction: column; gap: 16px">

      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.025em">订单</h1>
        <button type="button" style="height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 7px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font: inherit; cursor: pointer">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>导出
        </button>
      </div>

      <div role="tablist" aria-label="订单状态" style="display: flex; flex-wrap: wrap; gap: 20px; border-bottom: 1px solid {{t.border}}">
        <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="7">
          <button type="button" role="tab" aria-selected="{{tab.selected}}" style="height: 36px; padding: 0; margin-bottom: -1px; border: 0; border-bottom: 1.5px solid {{tab.line}}; background: transparent; color: {{tab.color}}; font: inherit; font-weight: 500; cursor: pointer">{{tab.name}}<span style="margin-left: 6px; font-family: 'Geist Mono', monospace; font-size: 11px; color: {{t.faint}}">{{tab.count}}</span></button>
        </sc-for>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; border: 1px solid {{t.alertLine}}; background: {{t.alertSoft}}; color: {{t.alert}}">
        <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2.5 20h19zM12 10v4M12 17h.01"></path></svg>
        <span style="flex: 1 1 320px">2 笔订单有付款需要人工审核。请先向支付服务商确认是否已扣款，再在订单详情页确认或关闭。</span>
        <button type="button" style="height: 30px; padding: 0 10px; border-radius: 7px; border: 1px solid {{t.alertLine}}; background: transparent; color: {{t.alert}}; font: inherit; font-weight: 500; cursor: pointer">只看待审核</button>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <div style="flex: 1 1 260px; position: relative; display: flex">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{t.faint}}" stroke-width="2" stroke-linecap="round" style="position: absolute; left: 11px; top: 10px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <label for="order-search" style="position: absolute; left: -9999px">搜索订单</label>
          <input id="order-search" type="search" placeholder="搜索订单编号或客户邮箱" style="flex: 1 1 auto; min-width: 0; height: 34px; box-sizing: border-box; border-radius: 7px; border: 1px solid {{t.border}}; background: {{t.raised}}; color: {{t.fg}}; padding: 0 12px 0 32px; font: inherit">
        </div>
        <sc-for list="{{selects}}" as="s" hint-placeholder-count="2">
          <button type="button" aria-haspopup="listbox" style="height: 34px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; border-radius: 7px; border: 1px solid {{t.border}}; background: {{t.raised}}; color: {{t.fg}}; font: inherit; cursor: pointer">
            <span style="color: {{t.faint}}">{{s.label}}</span>{{s.value}}
            <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{t.faint}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
        </sc-for>
      </div>

      <sc-if value="{{filtered}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
          <sc-for list="{{chips}}" as="c" hint-placeholder-count="2">
            <span style="height: 26px; display: inline-flex; align-items: center; gap: 4px; padding: 0 4px 0 10px; border-radius: 999px; border: 1px solid {{t.border}}; background: {{t.raised}}">
              <span style="color: {{t.muted}}">{{c.k}}：</span>{{c.v}}
              <button type="button" aria-label="{{c.remove}}" style="width: 20px; height: 20px; border: 0; border-radius: 999px; background: transparent; color: {{t.muted}}; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
            </span>
          </sc-for>
          <button type="button" style="height: 26px; padding: 0 8px; border: 0; background: transparent; color: {{t.muted}}; font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px">清除全部</button>
        </div>
      </sc-if>

      <div style="border-radius: 10px; border: 1px solid {{t.border}}; overflow: hidden">
        <sc-if value="{{sel.banner}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; padding: 9px 16px; background: {{t.active}}; border-bottom: 1px solid {{t.border}}">
            <span>{{sel.bannerText}}</span>
            <button type="button" style="border: 0; background: transparent; color: {{t.fg}}; font: inherit; font-weight: 500; cursor: pointer; text-decoration: underline; text-underline-offset: 3px">{{sel.bannerAction}}</button>
          </div>
        </sc-if>
        <div style="overflow-x: auto">
        <table style="width: 100%; min-width: 820px; border-collapse: collapse">
          <thead>
            <tr style="color: {{t.faint}}; text-align: left; background: {{t.raised}}">
              <th scope="col" style="width: 40px; padding: 10px 0 10px 16px">
                <input type="checkbox" aria-label="选择本页全部订单" checked="{{sel.headChecked}}" style="width: 15px; height: 15px; margin: 0; accent-color: {{t.fg}}; cursor: pointer">
              </th>
              <th scope="col" style="padding: 10px 12px; font-weight: 500; font-size: 12px">订单</th>
              <th scope="col" style="padding: 10px 12px; font-weight: 500; font-size: 12px">客户</th>
              <th scope="col" style="padding: 10px 12px; font-weight: 500; font-size: 12px">状态</th>
              <th scope="col" style="padding: 10px 12px; font-weight: 500; font-size: 12px">付款</th>
              <th scope="col" aria-sort="none" style="padding: 10px 12px; font-weight: 500; font-size: 12px; text-align: right"><button type="button" style="border: 0; padding: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px">金额<svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.45"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg></button></th>
              <th scope="col" aria-sort="descending" style="padding: 10px 16px 10px 12px; font-weight: 500; font-size: 12px; text-align: right"><button type="button" style="border: 0; padding: 0; background: transparent; color: {{t.fg}}; font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px">下单时间（Asia/Shanghai）<svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"></path></svg></button></th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{orders}}" as="o" hint-placeholder-count="8">
              <tr class="jf-row" style="border-top: 1px solid {{t.border}}; background: {{o.rowBg}}; cursor: pointer">
                <td style="padding: 10px 0 10px 16px"><input type="checkbox" aria-label="{{o.checkLabel}}" checked="{{o.checked}}" style="width: 15px; height: 15px; margin: 0; accent-color: {{t.fg}}; cursor: pointer"></td>
                <td style="padding: 10px 12px">
                  <a href="OrderDetail.dc.html" style="display: flex; flex-direction: column; gap: 2px">
                    <span style="font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 500">{{o.no}}</span>
                    <span style="font-size: 12px; color: {{t.faint}}">{{o.items}}</span>
                  </a>
                </td>
                <td style="padding: 10px 12px; color: {{t.muted}}">{{o.email}}</td>
                <td style="padding: 10px 12px">
                  <span style="display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; color: {{o.statusColor}}">
                    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex: none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.4" stroke-dasharray="{{o.dash}}" fill="{{o.ring}}"></circle><path d="{{o.inner}}" fill="currentColor" stroke="{{o.innerStroke}}" stroke-width="1.4" stroke-linecap="round"></path></svg>
                    <span style="color: {{t.fg}}">{{o.status}}</span>
                  </span>
                </td>
                <td style="padding: 10px 12px">
                  <span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; border: 1px solid {{o.payBorder}}; background: {{o.payBg}}; color: {{o.payFg}}; font-size: 12px; white-space: nowrap">{{o.pay}}</span>
                </td>
                <td style="padding: 10px 12px; text-align: right; font-family: 'Geist Mono', monospace; font-size: 12px; white-space: nowrap">{{o.amount}}</td>
                <td style="padding: 10px 16px 10px 12px; text-align: right; color: {{t.muted}}; white-space: nowrap; font-variant-numeric: tabular-nums">{{o.time}}</td>
              </tr>
            </sc-for>
          </tbody>
        </table>
        </div>
      </div>

      <nav aria-label="翻页" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; color: {{t.muted}}">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
          <span style="font-variant-numeric: tabular-nums">{{page.range}}</span>
          <label style="display: inline-flex; align-items: center; gap: 6px">每页
            <button type="button" aria-haspopup="listbox" aria-label="每页条数" style="height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 7px; border: 1px solid {{t.border}}; background: {{t.raised}}; color: {{t.fg}}; font-family: 'Geist Mono', monospace; font-size: 12px; cursor: pointer">20<svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="{{t.faint}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
          条</label>
        </div>
        <div style="display: flex; align-items: center; gap: 4px">
          <button type="button" aria-label="上一页" disabled style="width: 30px; height: 30px; border-radius: 7px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.faint}}; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
          <sc-for list="{{page.items}}" as="p" hint-placeholder-count="5">
            <sc-if value="{{p.gap}}" hint-placeholder-val="{{ false }}"><span style="width: 24px; text-align: center; color: {{t.faint}}">…</span></sc-if>
            <sc-if value="{{p.num}}" hint-placeholder-val="{{ true }}">
              <button type="button" aria-label="{{p.label}}" aria-current="{{p.current}}" style="min-width: 30px; height: 30px; padding: 0 6px; border-radius: 7px; border: 1px solid {{p.border}}; background: {{p.bg}}; color: {{p.color}}; font-family: 'Geist Mono', monospace; font-size: 12px; cursor: pointer">{{p.num}}</button>
            </sc-if>
          </sc-for>
          <button type="button" aria-label="下一页" style="width: 30px; height: 30px; border-radius: 7px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
        </div>
      </nav>
    </div>

    <sc-if value="{{sel.any}}" hint-placeholder-val="{{ false }}">
      <div role="region" aria-label="批量操作" style="position: sticky; bottom: 16px; display: flex; justify-content: center; padding: 0 16px 16px">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; box-shadow: 0 8px 28px rgba(0,0,0,0.14)">
          <span style="font-weight: 500; margin-right: 8px">{{sel.count}}</span>
          <button type="button" style="height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 7px; border: 0; background: {{t.fg}}; color: {{t.bg}}; font: inherit; font-weight: 500; cursor: pointer">
            <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>导出所选
          </button>
          <button type="button" style="height: 30px; padding: 0 10px; border-radius: 7px; border: 0; background: transparent; color: {{t.muted}}; font: inherit; cursor: pointer">取消选择</button>
        </div>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["亮色","暗色"],"default":"亮色"},"selection":{"editor":"enum","options":["未选择","已选几条","本页全选","全部符合条件"],"default":"本页全选"},"filtered":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? '亮色';
    const selection = this.props.selection ?? '本页全选';
    const filtered = this.props.filtered ?? true;
    const t = mode === '暗色' ? {
      bg: '#000000', raised: '#0A0A0A', fg: '#EDEDED', muted: '#A1A1A1', faint: '#7C7C7C',
      border: 'rgba(255,255,255,0.09)', active: 'rgba(255,255,255,0.07)', alert: '#F5A97F', alertSoft: 'rgba(245,169,127,0.07)', alertLine: 'rgba(245,169,127,0.22)'
    } : {
      bg: '#FFFFFF', raised: '#FAFAFA', fg: '#171717', muted: '#5C5C5C', faint: '#737373',
      border: 'rgba(0,0,0,0.09)', active: 'rgba(0,0,0,0.04)', alert: '#B4470E', alertSoft: '#FFF6F0', alertLine: 'rgba(180,71,14,0.22)'
    };
    const total = filtered ? 46 : 128;
    const shape = {
      '待付款': { dash: '2 2.2', ring: 'none', inner: '', innerStroke: 'none', color: t.faint },
      '处理中': { dash: '', ring: 'none', inner: 'M7 3.5a3.5 3.5 0 0 1 0 7z', innerStroke: 'none', color: t.fg },
      '已发货': { dash: '', ring: 'none', inner: 'M7 3.5a3.5 3.5 0 1 1-3.5 3.5H7z', innerStroke: 'none', color: t.fg },
      '已送达': { dash: '', ring: 'currentColor', inner: '', innerStroke: 'none', color: t.fg },
      '已取消': { dash: '', ring: 'none', inner: 'M5.2 5.2l3.6 3.6M8.8 5.2l-3.6 3.6', innerStroke: 'currentColor', color: t.faint },
      '已退款': { dash: '', ring: 'none', inner: 'M5.2 5.2l3.6 3.6M8.8 5.2l-3.6 3.6', innerStroke: 'currentColor', color: t.faint }
    };
    const pay = (p) => p === '待人工审核'
      ? { payBorder: t.alertLine, payBg: t.alertSoft, payFg: t.alert }
      : { payBorder: t.border, payBg: 'transparent', payFg: p === '已付款' ? t.fg : t.faint };
    const rows = [
      ['#10428', 3, 'lin@example.com', '2026-10-13 17:41', '待付款', '未付款', '¥ 1,280.00'],
      ['#10427', 1, 'chen@example.com', '2026-10-13 17:12', '处理中', '待人工审核', '¥ 459.00'],
      ['#10426', 1, 'mia@example.com', '2026-10-13 16:55', '处理中', '已付款', '¥ 89.00'],
      ['#10425', 4, 'zhang@example.com', '2026-10-13 06:30', '已发货', '已付款', '¥ 2,016.00'],
      ['#10424', 2, 'wang@example.com', '2026-10-12 21:04', '已发货', '已付款', '¥ 318.00'],
      ['#10423', 1, 'lucas@example.com', '2026-10-12 16:47', '已送达', '已付款', '¥ 159.00'],
      ['#10422', 1, 'zhao@example.com', '2026-10-12 11:20', '已退款', '已退款', '¥ 239.00'],
      ['#10421', 1, 'zhou@example.com', '2026-10-11 21:15', '已取消', '未付款', '¥ 129.00']
    ];
    const some = selection === '已选几条', pageAll = selection === '本页全选', all = selection === '全部符合条件';
    const isChecked = (i) => pageAll || all || (some && (i === 1 || i === 2 || i === 4));
    const count = all ? '已选全部 ' + total + ' 个订单' : pageAll ? '已选 20 个订单' : some ? '已选 3 个订单' : '';
    const tabs = [['全部', '128', true], ['待付款', '6'], ['处理中', '14'], ['已发货', '21'], ['已送达', '71'], ['已取消', '8'], ['已退款', '8']]
      .map(([name, count, sel]) => ({ name, count, selected: sel ? 'true' : 'false', line: sel ? t.fg : 'transparent', color: sel ? t.fg : t.faint }));
    const pages = Math.ceil(total / 20);
    const nums = pages <= 7 ? Array.from({ length: pages }, (_, i) => i + 1) : [1, 2, 3, 'gap', pages];
    return {
      t, mode, filtered, tabs,
      selects: [{ label: '付款', value: filtered ? '已付款' : '全部' }, { label: '下单时间', value: filtered ? '近 7 天' : '全部' }],
      chips: [{ k: '付款', v: '已付款', remove: '移除筛选：付款 已付款' }, { k: '下单时间', v: '近 7 天', remove: '移除筛选：下单时间 近 7 天' }],
      sel: {
        any: some || pageAll || all, count,
        headChecked: pageAll || all,
        banner: pageAll || all,
        bannerText: all ? '已选全部 ' + total + ' 个符合条件的订单。' : '已选本页 20 个订单。',
        bannerAction: all ? '只选本页' : '选择全部 ' + total + ' 个符合条件的订单'
      },
      page: {
        range: '1–20，共 ' + total + ' 条',
        items: nums.map(n => n === 'gap'
          ? { gap: true, num: '' }
          : { gap: false, num: String(n), label: '第 ' + n + ' 页', current: n === 1 ? 'page' : 'false',
              border: n === 1 ? t.fg : t.border, bg: n === 1 ? t.fg : t.bg, color: n === 1 ? t.bg : t.fg })
      },
      orders: rows.filter(r => !filtered || r[5] === '已付款').map(([no, n, email, time, status, p, amount], i) => ({
        no, email, time, status, pay: p, amount, items: n + ' 件商品',
        checked: isChecked(i), checkLabel: '选择订单 ' + no, rowBg: isChecked(i) ? t.active : 'transparent',
        statusColor: shape[status].color, dash: shape[status].dash, ring: shape[status].ring,
        inner: shape[status].inner, innerStroke: shape[status].innerStroke, ...pay(p)
      }))
    };
  }
}
</script>
</body>
</html>
