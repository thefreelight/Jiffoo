<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>后台 · 商品列表</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@media (min-width: 800px){.jf-side{position:sticky;top:0;align-self:flex-start}}
a{text-decoration:none;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #7A7A7A;outline-offset:1px}
.jf-row:hover{background:rgba(128,128,128,0.06)}
.jf-item:hover{background:rgba(128,128,128,0.08)}
</style>
</helmet>
<div style="position: relative; font-family: 'Geist', 'Noto Sans SC', sans-serif; font-size: 13px; background: {{t.bg}}; color: {{t.fg}}; min-height: 100%; display: flex; flex-wrap: wrap; align-items: stretch">
  <aside class="jf-side" style="flex: 0 0 240px; max-width: 100%; border-right: 1px solid {{t.border}}">
    <dc-import name="Sidebar" mode="{{mode}}" active="商品" hint-size="240px,900px"></dc-import>
  </aside>
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <div style="flex: 1 1 auto; width: 100%; max-width: 1120px; box-sizing: border-box; margin: 0 auto; padding: 40px 32px 32px; display: flex; flex-direction: column; gap: 16px">

      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.025em">商品</h1>
        <div style="display: flex; gap: 8px">
          <button type="button" style="height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 7px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font: inherit; cursor: pointer">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>导出
          </button>
          <a href="ProductEdit.dc.html" style="height: 32px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 7px; background: {{t.fg}}; color: {{t.bg}}; font-weight: 500">添加商品</a>
        </div>
      </div>

      <div role="tablist" aria-label="商品状态" style="display: flex; flex-wrap: wrap; gap: 20px; border-bottom: 1px solid {{t.border}}">
        <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
          <button type="button" role="tab" aria-selected="{{tab.selected}}" style="height: 36px; padding: 0; margin-bottom: -1px; border: 0; border-bottom: 1.5px solid {{tab.line}}; background: transparent; color: {{tab.color}}; font: inherit; font-weight: 500; cursor: pointer">{{tab.name}}<span style="margin-left: 6px; font-family: 'Geist Mono', monospace; font-size: 11px; color: {{tab.countColor}}">{{tab.count}}</span></button>
        </sc-for>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <div style="flex: 1 1 260px; position: relative; display: flex">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{t.faint}}" stroke-width="2" stroke-linecap="round" style="position: absolute; left: 11px; top: 10px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <label for="product-search" style="position: absolute; left: -9999px">搜索商品</label>
          <input id="product-search" type="search" placeholder="搜索商品名称、SPU 或 SKU" style="flex: 1 1 auto; min-width: 0; height: 34px; box-sizing: border-box; border-radius: 7px; border: 1px solid {{t.border}}; background: {{t.raised}}; color: {{t.fg}}; padding: 0 12px 0 32px; font: inherit">
        </div>
        <button type="button" aria-haspopup="listbox" style="height: 34px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; border-radius: 7px; border: 1px solid {{t.border}}; background: {{t.raised}}; color: {{t.fg}}; font: inherit; cursor: pointer">
          <span style="color: {{t.faint}}">分类</span>全部
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{t.faint}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
        <a href="Categories.dc.html" style="height: 34px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 7px; border: 1px solid {{t.border}}; color: {{t.fg}}">管理分类</a>
      </div>

      <div style="border-radius: 10px; border: 1px solid {{t.border}}">
        <sc-if value="{{sel.banner}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; padding: 9px 16px; background: {{t.active}}; border-bottom: 1px solid {{t.border}}; border-radius: 10px 10px 0 0">
            <span>{{sel.bannerText}}</span>
            <button type="button" style="border: 0; background: transparent; color: {{t.fg}}; font: inherit; font-weight: 500; cursor: pointer; text-decoration: underline; text-underline-offset: 3px">{{sel.bannerAction}}</button>
          </div>
        </sc-if>
        <div style="overflow-x: auto">
        <table style="width: 100%; min-width: 760px; border-collapse: collapse">
          <thead>
            <tr style="color: {{t.faint}}; text-align: left; background: {{t.raised}}">
              <th scope="col" style="width: 40px; padding: 10px 0 10px 16px"><input type="checkbox" aria-label="选择本页全部商品" checked="{{sel.headChecked}}" style="width: 15px; height: 15px; margin: 0; accent-color: {{t.fg}}; cursor: pointer"></th>
              <th scope="col" aria-sort="none" style="padding: 10px 12px; font-weight: 500; font-size: 12px"><button type="button" style="border: 0; padding: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px">商品<svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.45"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg></button></th>
              <th scope="col" style="padding: 10px 12px; font-weight: 500; font-size: 12px">状态</th>
              <th scope="col" aria-sort="none" style="padding: 10px 12px; font-weight: 500; font-size: 12px; text-align: right"><button type="button" style="border: 0; padding: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px">价格<svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.45"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg></button></th>
              <th scope="col" aria-sort="ascending" style="padding: 10px 12px; font-weight: 500; font-size: 12px; text-align: right"><button type="button" style="border: 0; padding: 0; background: transparent; color: {{t.fg}}; font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px">库存<svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button></th>
              <th scope="col" aria-sort="none" style="padding: 10px 12px; font-weight: 500; font-size: 12px; text-align: right"><button type="button" style="border: 0; padding: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px">更新时间<svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.45"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg></button></th>
              <th scope="col" style="width: 48px"><span style="position: absolute; left: -9999px">操作</span></th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{rows}}" as="p" hint-placeholder-count="5">
              <tr class="jf-row" style="border-top: 1px solid {{t.border}}; background: {{p.rowBg}}; cursor: pointer">
                <td style="padding: 10px 0 10px 16px"><input type="checkbox" aria-label="{{p.checkLabel}}" checked="{{p.checked}}" style="width: 15px; height: 15px; margin: 0; accent-color: {{t.fg}}; cursor: pointer"></td>
                <td style="padding: 10px 12px">
                  <a href="ProductEdit.dc.html" style="display: flex; align-items: center; gap: 12px">
                    <span aria-hidden="true" style="width: 36px; height: 36px; flex: none; border-radius: 7px; border: 1px solid {{t.border}}; background: {{p.thumb}}; display: flex; align-items: center; justify-content: center; color: {{t.faint}}">
                      <sc-if value="{{p.noImage}}" hint-placeholder-val="{{ true }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5 12 3.5l8.5 4v9l-8.5 4-8.5-4zM3.5 7.5 12 11.5l8.5-4M12 11.5v9"></path></svg></sc-if>
                    </span>
                    <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                      <span style="font-weight: 500">{{p.name}}</span>
                      <span style="font-size: 12px; color: {{t.faint}}">{{p.meta}}</span>
                    </span>
                  </a>
                </td>
                <td style="padding: 10px 12px">
                  <span style="display: inline-flex; align-items: center; gap: 7px; color: {{p.statusColor}}; white-space: nowrap">
                    <span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 999px; border: 1.4px solid currentColor; background: {{p.dotFill}}"></span>{{p.status}}
                  </span>
                </td>
                <td style="padding: 10px 12px; text-align: right; font-family: 'Geist Mono', monospace; font-size: 12px; white-space: nowrap">{{p.price}}</td>
                <td style="padding: 10px 12px; text-align: right; font-family: 'Geist Mono', monospace; font-size: 12px; color: {{p.stockColor}}">{{p.stock}}</td>
                <td style="padding: 10px 12px; text-align: right; color: {{t.muted}}; white-space: nowrap; font-variant-numeric: tabular-nums">{{p.updated}}</td>
                <td style="padding: 6px 12px; text-align: right">
                  <button type="button" aria-label="{{p.menuLabel}}" aria-haspopup="menu" style="width: 30px; height: 30px; border: 0; border-radius: 7px; background: transparent; color: {{t.muted}}; cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
                    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
                  </button>
                </td>
              </tr>
            </sc-for>
          </tbody>
        </table>
        </div>
      </div>

      <nav aria-label="翻页" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; color: {{t.muted}}">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
          <span style="font-variant-numeric: tabular-nums">1–5，共 5 条</span>
          <label style="display: inline-flex; align-items: center; gap: 6px">每页
            <button type="button" aria-haspopup="listbox" aria-label="每页条数" style="height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 7px; border: 1px solid {{t.border}}; background: {{t.raised}}; color: {{t.fg}}; font-family: 'Geist Mono', monospace; font-size: 12px; cursor: pointer">20<svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="{{t.faint}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
          条</label>
        </div>
        <div style="display: flex; align-items: center; gap: 4px">
          <button type="button" aria-label="上一页" disabled style="width: 30px; height: 30px; border-radius: 7px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.faint}}; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
          <button type="button" aria-label="第 1 页" aria-current="page" style="min-width: 30px; height: 30px; padding: 0 6px; border-radius: 7px; border: 1px solid {{t.fg}}; background: {{t.fg}}; color: {{t.bg}}; font-family: 'Geist Mono', monospace; font-size: 12px">1</button>
          <button type="button" aria-label="下一页" disabled style="width: 30px; height: 30px; border-radius: 7px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.faint}}; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
        </div>
      </nav>
    </div>

    <sc-if value="{{sel.any}}" hint-placeholder-val="{{ false }}">
      <div role="region" aria-label="批量操作" style="position: sticky; bottom: 16px; display: flex; justify-content: center; padding: 0 16px 16px">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 8px 8px 16px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; box-shadow: 0 8px 28px rgba(0,0,0,0.14)">
          <span style="font-weight: 500; margin-right: 8px">{{sel.count}}</span>
          <sc-for list="{{bulk}}" as="b" hint-placeholder-count="4">
            <button type="button" style="height: 30px; padding: 0 10px; border-radius: 7px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{b.color}}; font: inherit; cursor: pointer">{{b.label}}</button>
          </sc-for>
          <button type="button" style="height: 30px; padding: 0 10px; border-radius: 7px; border: 0; background: transparent; color: {{t.muted}}; font: inherit; cursor: pointer">取消选择</button>
        </div>
      </div>
    </sc-if>
  </main>

  <sc-if value="{{showDelete}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: flex-start; justify-content: center; padding: 160px 16px 16px; box-sizing: border-box">
      <div role="alertdialog" aria-modal="true" aria-labelledby="del-title" aria-describedby="del-desc" style="width: 100%; max-width: 440px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; box-shadow: 0 16px 48px rgba(0,0,0,0.2); padding: 20px; display: flex; flex-direction: column; gap: 12px">
        <h2 id="del-title" style="margin: 0; font-size: 16px; font-weight: 600">删除 3 个商品？</h2>
        <div id="del-desc" style="display: flex; flex-direction: column; gap: 8px; color: {{t.muted}}; line-height: 1.6">
          <p style="margin: 0">将删除 2 个商品：帆布托特包、电子礼品卡。删除后无法恢复。</p>
          <p style="margin: 0; padding: 10px 12px; border-radius: 7px; background: {{t.raised}}; border: 1px solid {{t.border}}">亚麻衬衫已有订单，不能删除，会自动跳过。想让它不再出售，可以改为下架。</p>
        </div>
        <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 4px">
          <button type="button" style="height: 32px; padding: 0 12px; border-radius: 7px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font: inherit; cursor: pointer">取消</button>
          <button type="button" style="height: 32px; padding: 0 14px; border-radius: 7px; border: 0; background: {{t.danger}}; color: {{t.onDanger}}; font: inherit; font-weight: 500; cursor: pointer">删除 2 个商品</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["亮色","暗色"],"default":"亮色"},"selection":{"editor":"enum","options":["未选择","已选几条","本页全选"],"default":"已选几条"},"showDelete":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? '亮色';
    const selection = this.props.selection ?? '已选几条';
    const t = mode === '暗色' ? {
      bg: '#000000', raised: '#0A0A0A', fg: '#EDEDED', muted: '#A1A1A1', faint: '#7C7C7C', thumb: '#1A1A1A',
      border: 'rgba(255,255,255,0.09)', active: 'rgba(255,255,255,0.07)', alert: '#F5A97F', danger: '#FCA5A5', onDanger: '#000000'
    } : {
      bg: '#FFFFFF', raised: '#FAFAFA', fg: '#171717', muted: '#5C5C5C', faint: '#737373', thumb: '#EDEDED',
      border: 'rgba(0,0,0,0.09)', active: 'rgba(0,0,0,0.04)', alert: '#B4470E', danger: '#B91C1C', onDanger: '#FFFFFF'
    };
    const st = {
      '在售': { statusColor: t.fg, dotFill: 'currentColor' },
      '已下架': { statusColor: t.faint, dotFill: 'transparent' },
      '缺货': { statusColor: t.alert, dotFill: 'currentColor' }
    };
    const data = [
      ['羊毛围巾', 'SCARF-WOOL · 配件 · 2 个规格', '缺货', '¥ 129.00', '0', false, '2026-10-12 10:20'],
      ['旧款棒球帽', 'CAP-2025 · 配件', '已下架', '¥ 49.00', '6', true, '2026-09-28 15:02'],
      ['亚麻衬衫', 'SHIRT-LINEN · 服装 · 3 个规格', '在售', '¥ 59.00 起', '42', false, '2026-10-13 09:41'],
      ['帆布托特包', 'TOTE · 配件', '在售', '¥ 20.00', '118', true, '2026-10-01 18:30'],
      ['电子礼品卡', 'P000118 · 礼品卡 · 无需配送', '在售', '¥ 100.00 起', '500', false, '2026-09-20 11:12']
    ];
    const some = selection === '已选几条', pageAll = selection === '本页全选';
    const isChecked = (i) => pageAll || (some && i >= 2 && i <= 4);
    return {
      t, mode, showDelete: this.props.showDelete ?? false,
      tabs: [['全部', '5', true], ['在售', '3'], ['已下架', '1'], ['缺货', '1', false, true]].map(([name, count, sel, warn]) => ({
        name, count, selected: sel ? 'true' : 'false', line: sel ? t.fg : 'transparent', color: sel ? t.fg : t.faint, countColor: warn ? t.alert : t.faint
      })),
      sel: {
        any: some || pageAll,
        count: pageAll ? '已选 5 个商品' : '已选 3 个商品',
        headChecked: pageAll,
        banner: false, bannerText: '', bannerAction: ''
      },
      bulk: [
        { label: '上架', color: t.fg }, { label: '下架', color: t.fg }, { label: '改分类', color: t.fg },
        { label: '导出', color: t.fg }, { label: '删除', color: t.danger }
      ],
      rows: data.map(([name, meta, status, price, stock, hasImg, updated], i) => ({
        name, meta, status, price, stock, updated,
        noImage: !hasImg, thumb: hasImg ? t.thumb : t.raised,
        stockColor: stock === '0' ? t.alert : t.fg,
        checked: isChecked(i), checkLabel: '选择商品 ' + name, rowBg: isChecked(i) ? t.active : 'transparent',
        menuLabel: name + ' 的更多操作',
        ...st[status]
      }))
    };
  }
}
</script>
</body>
</html>
