name: CI

on:
  push:
    branches: [codex/core-extension-boundary]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18.2
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: jiffoo_core_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d jiffoo_core_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/jiffoo_core_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Initialize verification artifacts
        run: node scripts/verify-ci.mjs --initialize
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.1
          cache: pnpm
      - name: Docker version
        run: docker version 2>&1 | tee -a "${{ runner.temp }}/verification/preflight.log"
      - name: Microsoft Edge version
        run: microsoft-edge --version 2>&1 | tee -a "${{ runner.temp }}/verification/preflight.log"
      - name: Prepare approved upload storage image
        run: |
          docker pull --platform linux/amd64 pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 2>&1 | tee -a "${{ runner.temp }}/verification/preflight.log"
      - name: Record upload storage image inspection
        run: docker image inspect pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 2>&1 | tee -a "${{ runner.temp }}/verification/preflight.log"
      - name: Run verification catalogue
        run: node scripts/verify-ci.mjs api ${{ matrix.shard }}/4
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-api-${{ matrix.shard }}
          path: ${{ runner.temp }}/verification/
          retention-days: 14
          if-no-files-found: error
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-api-${{ matrix.shard }}
          path: e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.2
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: jiffoo_core_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d jiffoo_core_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/jiffoo_core_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Initialize verification artifacts
        run: node scripts/verify-ci.mjs --initialize
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.1
          cache: pnpm
      - name: Docker version
        run: docker version 2>&1 | tee -a "${{ runner.temp }}/verification/preflight.log"
      - name: Microsoft Edge version
        run: microsoft-edge --version 2>&1 | tee -a "${{ runner.temp }}/verification/preflight.log"
      - name: Prepare approved upload storage image
        run: |
          docker pull --platform linux/amd64 pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 2>&1 | tee -a "${{ runner.temp }}/verification/preflight.log"
      - name: Record upload storage image inspection
        run: docker image inspect pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 2>&1 | tee -a "${{ runner.temp }}/verification/preflight.log"
      - name: Run verification catalogue
        run: node scripts/verify-ci.mjs quality
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-quality
          path: ${{ runner.temp }}/verification/
          retention-days: 14
          if-no-files-found: error
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-quality
          path: e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.2
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: jiffoo_core_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d jiffoo_core_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/jiffoo_core_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Initialize verification artifacts
        run: node scripts/verify-ci.mjs --initialize
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.1
          cache: pnpm
      - name: Docker version
        run: docker version 2>&1 | tee -a "${{ runner.temp }}/verification/preflight.log"
      - name: Microsoft Edge version
        run: microsoft-edge --version 2>&1 | tee -a "${{ runner.temp }}/verification/preflight.log"
      - name: Prepare approved upload storage image
        run: |
          docker pull --platform linux/amd64 pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 2>&1 | tee -a "${{ runner.temp }}/verification/preflight.log"
      - name: Record upload storage image inspection
        run: docker image inspect pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 2>&1 | tee -a "${{ runner.temp }}/verification/preflight.log"
      - name: Run verification catalogue
        run: node scripts/verify-ci.mjs e2e
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-e2e
          path: ${{ runner.temp }}/verification/
          retention-days: 14
          if-no-files-found: error
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-e2e
          path: e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/jiffoo_core_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.1
      - name: Run isolated Docker Compose acceptance
        run: node scripts/verify-compose.mjs
      - name: Upload Compose verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-compose
          path: ${{ runner.temp }}/verification/
          retention-days: 14
          if-no-files-found: error
  release-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/jiffoo_core_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.1
      - name: Install dependencies for release acceptance
        run: corepack enable && corepack pnpm install --frozen-lockfile
      - name: Verify local release identity and tamper refusal
        run: node scripts/verify-release.mjs
      - name: Upload release verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-release
          path: ${{ runner.temp }}/verification/
          retention-days: 14
          if-no-files-found: error
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/jiffoo_core_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.1
      - name: Install dependencies for backup acceptance
        run: corepack enable && corepack pnpm install --frozen-lockfile
      - name: Verify isolated backup and restore
        run: node scripts/verify-backup.mjs
      - name: Upload backup verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-backup
          path: ${{ runner.temp }}/verification/
          retention-days: 14
          if-no-files-found: error
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/jiffoo_core_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.1
      - name: Install update acceptance dependencies
        run: corepack enable && corepack pnpm install --frozen-lockfile
      - name: Verify no-migration update core profile
        run: node scripts/verify-update.mjs --profile=core
      - name: Upload update verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-update
          path: ${{ runner.temp }}/verification/
          retention-days: 14
          if-no-files-found: error
  summary:
    if: always()
    needs: [api, quality, e2e, compose, release-verify, backup, update]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verify-*
          path: ${{ runner.temp }}/verification-inputs
      - name: Require successful jobs and reconcile API coverage
        if: always()
        run: node scripts/verify-ci-summary.mjs "${{ runner.temp }}/verification-inputs" '${{ toJSON(needs) }}' 2>&1 | tee "${{ runner.temp }}/verification-summary.log"
      - name: Publish merged verification summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-merged-summary
          path: |
            verify-summary.txt
            ${{ runner.temp }}/verification-summary.log
          retention-days: 14
          if-no-files-found: error
