name: OSS Release Convergence Monitor

on:
  schedule:
    # Mondays 04:00 UTC — verify the latest published release still converges
    # with the public self-hosted feed, runtime images, and release assets.
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: oss-release-convergence-monitor
  cancel-in-progress: false

env:
  REGISTRY: crpi-si4hvlqhabu9zjq7.ap-southeast-1.personal.cr.aliyuncs.com

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Resolve latest published release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name')"
          if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
            echo "No published release found" >&2
            exit 1
          fi
          echo "Latest published release: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify release convergence (feed + images + assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/verify-public-release-convergence.mjs \
            --release-tag "${{ steps.latest.outputs.tag }}" \
            --public-url https://get.jiffoo.com/releases/core/manifest.json \
            --verify-images

      - name: Close resolved convergence alerts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label release-convergence --json number --jq '.[].number' \
          | while read -r number; do
              [ -n "$number" ] || continue
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                --comment "Release convergence verified green; auto-closing this alert."
            done

      - name: Open convergence failure alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create release-convergence --repo "$GITHUB_REPOSITORY" \
            --color D93F0B 2>/dev/null || true
          COUNT="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label release-convergence --json number --jq 'length')"
          if [ "${COUNT}" -ne 0 ]; then
            echo "Convergence alert already open; not duplicating."
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --label release-convergence \
            --title "OSS release convergence broken" \
            --body "The scheduled convergence monitor failed.

            Checks: latest published release ↔ get.jiffoo.com manifest ↔ published runtime images ↔ required release assets.

            Failed run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

            Reproduce locally:
            \`node scripts/verify-public-release-convergence.mjs --release-tag <tag> --public-url https://get.jiffoo.com/releases/core/manifest.json --verify-images\`"

  # Second failure mode from the 162/163 stalls: the bot cuts the weekly
  # draft automatically, but publishing it is manual — if no session picks
  # it up, the draft (often with a version-drift warning) sits for days and
  # the train silently stops. Flag any unpublished draft older than 3 days.
  draft-stall:
    runs-on: ubuntu-latest
    steps:
      - name: Flag stale unpublished release drafts (>3 days)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create release-train-stall --repo "$GITHUB_REPOSITORY" \
            --color F9A625 2>/dev/null || true
          STALE="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '[.[] | select(.draft)] | map(select((now - (.created_at | fromdateiso8601)) / 86400 > 3)) | length')"
          if [ "${STALE}" -ne 0 ]; then
            OPEN="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --label release-train-stall --json number --jq 'length')"
            if [ "${OPEN}" -eq 0 ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --label release-train-stall \
                --title "Release train stalled: unpublished draft older than 3 days" \
                --body "The weekly release draft has been sitting unpublished for over 3 days.

            Review, adjust wording, then publish it (\`gh release edit <tag> --draft=false --latest\`), or delete and re-cut via the OSS Release Draft workflow if a version-drift warning is flagged.

            Detected by run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            fi
            echo "Stale draft detected; failing this job to surface the stall." >&2
            exit 1
          fi
          gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label release-train-stall --json number --jq '.[].number' \
          | while read -r number; do
              [ -n "$number" ] || continue
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                --comment "No stale release draft remains; auto-closing this alert."
            done
