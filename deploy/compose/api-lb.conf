pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  set_real_ip_from 172.30.65.10;
  set_real_ip_from 172.30.65.11;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  upstream api { server api-1:3001; server api-2:3001; }
  server {
    listen 8080;
    client_max_body_size 25m;
    location = /health { access_log off; return 200 'ok'; }
    location / {
      proxy_pass http://api;
      # Preserve authority across the second proxy hop, including public ports.
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
