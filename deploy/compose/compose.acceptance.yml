x-test-env: &test-env
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/jiffoo_core_test

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jiffoo_core_test
  silo-init:
    command: ['/bootstrap/silo-init.sh', acceptance]
  db-init:
    environment: *test-env
  silo-volume-init:
    environment: *test-env
  api-1:
    environment: *test-env
  api-2:
    environment: *test-env
  worker-1:
    environment: *test-env
  worker-2:
    environment: *test-env
  acceptance:
    image: ${COMPOSE_PROJECT_NAME}-backend
    profiles: [acceptance]
    user: '1000:1000'
    init: true
    read_only: true
    tmpfs: [/tmp]
    network_mode: service:postgres
    volumes: ['${TLS_CERT_FILE}:/tls/cert.pem:ro']
    environment:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/jiffoo_core_test
      STOREFRONT_URL: ${STOREFRONT_URL}
      ADMIN_URL: ${ADMIN_URL}
      UPLOAD_S3_ENDPOINT: http://silo:9000
      UPLOAD_S3_REGION: us-east-1
      UPLOAD_S3_BUCKET: ${UPLOAD_S3_BUCKET}
      UPLOAD_S3_ACCESS_KEY_ID: ${SILO_APP_ACCESS_KEY_ID}
      UPLOAD_S3_SECRET_ACCESS_KEY: ${SILO_APP_SECRET_ACCESS_KEY}
    command: [node, /app/deploy/compose/scenario17.mjs, state]
  client-a:
    image: ${COMPOSE_PROJECT_NAME}-backend
    profiles: [acceptance]
    user: '1000:1000'
    read_only: true
    environment:
      STOREFRONT_URL: ${STOREFRONT_URL}
      ADMIN_URL: ${ADMIN_URL}
    volumes: ['${TLS_CERT_FILE}:/tls/cert.pem:ro']
    networks:
      core: { ipv4_address: 172.30.65.21 }
    command: [node, /app/deploy/compose/scenario17.mjs, rate-a]
  client-b:
    image: ${COMPOSE_PROJECT_NAME}-backend
    profiles: [acceptance]
    user: '1000:1000'
    read_only: true
    environment:
      STOREFRONT_URL: ${STOREFRONT_URL}
      ADMIN_URL: ${ADMIN_URL}
    volumes: ['${TLS_CERT_FILE}:/tls/cert.pem:ro']
    networks:
      core: { ipv4_address: 172.30.65.22 }
    command: [node, /app/deploy/compose/scenario17.mjs, rate-b]
