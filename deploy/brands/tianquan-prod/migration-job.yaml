apiVersion: batch/v1
kind: Job
metadata:
  name: tianquan-migrate-07b38815-r7
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: { app: tianquan-migration }
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: crpi-si4hvlqhabu9zjq7.ap-southeast-1.personal.cr.aliyuncs.com/jiffoo-oss/api@sha256:a95ed641b8ba0e6151db49949a4b83c6407147d00a9aba46b42b7f612cdba939
          command: [sh, -lc, 'cd /app/apps/api && ln -s ../migrations prisma/schema/migrations && /app/node_modules/.bin/prisma migrate deploy --schema=./prisma/schema']
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: tianquan-secrets, key: database-url } }
