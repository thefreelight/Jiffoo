apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: tianquan-postgres }
  template:
    metadata:
      labels: { app: tianquan-postgres }
    spec:
      nodeSelector: { kubernetes.io/hostname: k8s-worker-02 }
      containers:
        - name: postgres
          image: postgres:15.14-alpine
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: tianquan }
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: tianquan-secrets, key: postgres-user } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: tianquan-secrets, key: postgres-password } } }
          readinessProbe:
            exec: { command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d tianquan'] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: postgres-data } }]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: tianquan-postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app: tianquan-redis }
  template:
    metadata:
      labels: { app: tianquan-redis }
    spec:
      nodeSelector: { kubernetes.io/hostname: k8s-worker-02 }
      containers:
        - name: redis
          image: redis:7-alpine
          args: [redis-server, --appendonly, 'yes']
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 512Mi }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: redis-data } }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: tianquan-redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
