<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jiffoo Mall - 开发环境导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .header .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }
        
        .info-bar {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .info-item {
            background: #f8f9fa;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .info-item strong {
            color: #667eea;
            margin-right: 8px;
        }
        
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .service-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        
        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
        }
        
        .service-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .service-name {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        
        .service-desc {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .service-url {
            display: block;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            word-break: break-all;
            margin-bottom: 15px;
        }
        
        .service-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-online {
            background: #d4edda;
            color: #155724;
        }
        
        .status-checking {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-offline {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .status-online .status-dot {
            background: #28a745;
        }
        
        .status-checking .status-dot {
            background: #ffc107;
        }
        
        .status-offline .status-dot {
            background: #dc3545;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .footer {
            background: white;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .footer p {
            color: #666;
            font-size: 14px;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            margin-top: 15px;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎉 Jiffoo Mall</h1>
            <p class="subtitle">开发环境 - 服务导航</p>
            <div class="info-bar">
                <div class="info-item">
                    <strong>环境:</strong> <span id="environment">Development</span>
                </div>
                <div class="info-item">
                    <strong>集群:</strong> <span id="cluster">Qujing K8s</span>
                </div>
                <div class="info-item">
                    <strong>最后更新:</strong> <span id="update-time">加载中...</span>
                </div>
            </div>
        </div>
        
        <div class="services-grid" id="services-grid">
            <!-- Services will be loaded here -->
        </div>
        
        <div class="footer">
            <p>💡 提示：点击服务卡片可直接访问对应服务</p>
            <a href="https://github.com/thefreelight/Jiffoo" class="btn" target="_blank">
                📚 查看项目文档
            </a>
        </div>
    </div>
    
    <script>
        const services = [
            {
                icon: '🎨',
                name: 'Frontend',
                desc: '用户端前台页面，提供商品浏览、购物车、订单等功能',
                url: 'http://jiffoo.chfastpay.com:30000',
                port: 30000
            },
            {
                icon: '👨‍💼',
                name: 'Admin',
                desc: '商家管理后台，管理商品、订单、用户等',
                url: 'http://jiffoo.chfastpay.com:30003',
                port: 30003
            },
            {
                icon: '🦸',
                name: 'Super Admin',
                desc: '超级管理员后台，系统配置和全局管理',
                url: 'http://jiffoo.chfastpay.com:30004',
                port: 30004
            },
            {
                icon: '🤝',
                name: 'Agent Portal',
                desc: '代理商门户，管理下级商户和佣金',
                url: 'http://jiffoo.chfastpay.com:30005',
                port: 30005
            },
            {
                icon: '🏷️',
                name: 'White Label',
                desc: '白标系统，支持多品牌定制',
                url: 'http://jiffoo.chfastpay.com:30006',
                port: 30006
            },
            {
                icon: '🔌',
                name: 'Distribution Plugin',
                desc: '分销插件，支持多级分销体系',
                url: 'http://jiffoo.chfastpay.com:30007',
                port: 30007
            },
            {
                icon: '🔧',
                name: 'Backend API',
                desc: '后端 API 服务，提供所有业务接口',
                url: 'http://jiffoo.chfastpay.com:30001',
                port: 30001
            },
            {
                icon: '📚',
                name: 'Docs (Internal)',
                desc: '内部文档，团队开发文档和 API 文档',
                url: 'http://jiffoo.chfastpay.com:30008',
                port: 30008
            },
            {
                icon: '📖',
                name: 'Docs (Public)',
                desc: '公开文档，用户使用手册和帮助中心',
                url: 'http://jiffoo.chfastpay.com:30009',
                port: 30009
            }
        ];
        
        // Update time
        document.getElementById('update-time').textContent = new Date().toLocaleString('zh-CN');
        
        // Render services
        const grid = document.getElementById('services-grid');
        services.forEach(service => {
            const card = document.createElement('div');
            card.className = 'service-card';
            card.onclick = () => window.open(service.url, '_blank');
            
            card.innerHTML = `
                <div class="service-icon">${service.icon}</div>
                <div class="service-name">${service.name}</div>
                <div class="service-desc">${service.desc}</div>
                <a href="${service.url}" class="service-url" onclick="event.stopPropagation()" target="_blank">
                    ${service.url}
                </a>
                <div class="service-status status-checking" id="status-${service.port}">
                    <span class="status-dot"></span>
                    <span>检查中...</span>
                </div>
            `;
            
            grid.appendChild(card);
            
            // Check service health
            checkServiceHealth(service.url, service.port);
        });
        
        async function checkServiceHealth(url, port) {
            const statusEl = document.getElementById(`status-${port}`);
            
            try {
                const response = await fetch(url, { 
                    method: 'HEAD',
                    mode: 'no-cors',
                    cache: 'no-cache'
                });
                
                // Since we're using no-cors, we can't check the actual status
                // We'll assume it's online if the fetch doesn't throw
                statusEl.className = 'service-status status-online';
                statusEl.innerHTML = '<span class="status-dot"></span><span>在线</span>';
            } catch (error) {
                // If fetch fails, mark as offline
                statusEl.className = 'service-status status-offline';
                statusEl.innerHTML = '<span class="status-dot"></span><span>离线</span>';
            }
        }
        
        // Auto refresh every 30 seconds
        setInterval(() => {
            services.forEach(service => {
                checkServiceHealth(service.url, service.port);
            });
            document.getElementById('update-time').textContent = new Date().toLocaleString('zh-CN');
        }, 30000);
    </script>
</body>
</html>
