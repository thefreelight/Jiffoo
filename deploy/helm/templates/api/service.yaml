{{- if .Values.services.api.enabled }}
{{- $serviceName := "api" }}
{{- $serviceConfig := .Values.services.api }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jiffoo.fullname" . }}-{{ $serviceName }}
  labels:
    {{- include "jiffoo.serviceLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "serviceName" $serviceName) | nindent 4 }}
spec:
  type: NodePort
  ports:
    - port: {{ $serviceConfig.port }}
      targetPort: http
      protocol: TCP
      name: http
      nodePort: {{ include "jiffoo.nodePort" (dict "port" $serviceConfig.port) }}
  selector:
    {{- include "jiffoo.serviceSelectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "serviceName" $serviceName) | nindent 4 }}
{{- end }}
