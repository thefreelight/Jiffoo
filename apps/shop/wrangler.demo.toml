name = "jiffoo-shop"
main = ".open-next/worker.js"
compatibility_date = "2026-07-13"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_API_URL = "/api"
API_SERVICE_URL = "https://demo-api.jiffoo.com"
SERVER_STORE_CONTEXT_TIMEOUT_MS = "2000"
THEME_APP_PROXY_DISABLED = "1"
THEME_APP_PROXY_TIMEOUT_MS = "1000"
NEXT_PUBLIC_FALLBACK_STORE_NAME = "Jiffoo Demo"
NEXT_PUBLIC_FALLBACK_THEME_SLUG = "builtin-default"
NEXT_PUBLIC_FALLBACK_THEME_VERSION = "1.0.0"
NEXT_PUBLIC_FALLBACK_DEFAULT_LOCALE = "en"
NEXT_PUBLIC_FALLBACK_SUPPORTED_LOCALES = "en,zh-Hant"
NEXT_PUBLIC_FALLBACK_POWERED_BY_JIFFOO = "1"

[[r2_buckets]]
binding = "THEME_ASSETS"
bucket_name = "jiffoo-theme-assets"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "jiffoo-shop"

routes = [{ pattern = "demo.jiffoo.com", custom_domain = true }]
